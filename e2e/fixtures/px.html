<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>px-sized fixture</title>
<style>
  body { margin: 16px; font: 14px/1.4 Georgia, serif; color: #333; background: #fafafa; }
  h1 { font-size: 18px; margin: 0 0 8px; }
  h2 { font-size: 16px; margin: 0 0 8px; }
  h3 { font-size: 15px; margin: 0 0 8px; }
  p { font-size: 14px; margin: 0 0 8px; }
  input { font-size: 14px; height: 22px; padding: 0 4px; box-sizing: border-box; }
</style>
</head>
<body>
<h1 id="h1">Heading one</h1>
<h2 id="h2">Heading two</h2>
<h3 id="h3">Heading three</h3>
<p id="p">Body paragraph in pixels.</p>
<p id="p2">A second paragraph so the page median is body text.</p>
<p id="p3">And a third one.</p>
<input id="inp" value="Some input text">
</body>
</html>
