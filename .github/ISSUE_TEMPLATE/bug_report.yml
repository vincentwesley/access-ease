name: Bug report
description: Something is not working as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the kind of site (not private URLs) and which settings were on.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: AccessEase version
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: Chrome 130 on Windows 11
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Additional context
